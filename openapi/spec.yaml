openapi: 3.1.0
info:
  title: Energy Control API
  version: 0.1.0
  description: Intelligent grid setpoint controller for Victron solar systems
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/status:
    get:
      operationId: getStatus
      summary: Current system status with live values and controller state
      responses:
        '200':
          description: Current system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /api/forecast:
    get:
      operationId: getForecast
      summary: Today's solar forecast (hourly)
      responses:
        '200':
          description: Forecast data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'

  /api/config:
    get:
      operationId: getConfig
      summary: Current controller configuration
      responses:
        '200':
          description: Current config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerConfig'
    put:
      operationId: updateConfig
      summary: Update controller configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerConfig'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerConfig'

  /api/controller/mode:
    post:
      operationId: setControllerMode
      summary: Switch controller mode (auto/manual/winter)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModeRequest'
      responses:
        '200':
          description: Mode updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /api/controller/setpoint:
    put:
      operationId: setManualSetpoint
      summary: Set manual grid setpoint (only in manual mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSetpointRequest'
      responses:
        '200':
          description: Setpoint updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '409':
          description: Not in manual mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/verschattung/state:
    get:
      operationId: getVerschattungState
      summary: Current Verschattung state (cover positions + states + engine inputs)
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerschattungStateResponse'

  /api/verschattung/decisions:
    get:
      operationId: getVerschattungDecisions
      summary: Decision log (most recent first)
      responses:
        '200':
          description: Decision array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerschattungDecision'

  /api/verschattung/config:
    get:
      operationId: getVerschattungConfig
      responses:
        '200':
          description: Config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerschattungConfig'
    put:
      operationId: putVerschattungConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerschattungConfig'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerschattungConfig'

  /api/verschattung/cover/{id}/position:
    put:
      operationId: putVerschattungCoverPosition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: number
              required: [position]
      responses:
        '204':
          description: Sent

  /api/verschattung/cover/{id}/auto:
    post:
      operationId: postVerschattungCoverAuto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Override released

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ControllerMode:
      type: string
      enum: [auto, manual, winter]

    SystemStatus:
      type: object
      required: [pv, grid, battery, consumption, controller, timestamp]
      properties:
        pv:
          type: object
          required: [power]
          properties:
            power:
              type: number
              description: Current PV power in watts
        grid:
          type: object
          required: [power, setpoint]
          properties:
            power:
              type: number
              description: Current grid power in watts (negative = feed-in)
            setpoint:
              type: number
              description: Current grid setpoint in watts
        battery:
          type: object
          required: [power, soc]
          properties:
            power:
              type: number
              description: Battery power in watts (positive = charging)
            soc:
              type: number
              description: State of charge in percent (0-100)
        consumption:
          type: object
          required: [power]
          properties:
            power:
              type: number
              description: Total consumption in watts
        controller:
          type: object
          required: [mode, activeSetpoint]
          properties:
            mode:
              $ref: '#/components/schemas/ControllerMode'
            activeSetpoint:
              type: number
              description: Currently active grid setpoint in watts
            reason:
              type: string
              description: Human-readable reason for current setpoint
        timestamp:
          type: string
          format: date-time

    ControllerConfig:
      type: object
      required: [batteryCapacityKwh, minSocPercent, targetSocPercent, maxAcPowerW, winterModeThresholdFactor, regulationIntervalMs, largeChangeThresholdW, deadbandW]
      properties:
        batteryCapacityKwh:
          type: number
        minSocPercent:
          type: number
        targetSocPercent:
          type: number
        maxAcPowerW:
          type: number
        winterModeThresholdFactor:
          type: number
        regulationIntervalMs:
          type: number
        largeChangeThresholdW:
          type: number
        deadbandW:
          type: number

    ForecastHour:
      type: object
      required: [timestamp, powerW]
      properties:
        timestamp:
          type: string
          format: date-time
        powerW:
          type: number
          description: Forecasted power in watts for this hour

    ForecastResponse:
      type: object
      required: [hours, totalKwh, winterModeActive]
      properties:
        hours:
          type: array
          items:
            $ref: '#/components/schemas/ForecastHour'
        totalKwh:
          type: number
          description: Total forecasted production for the day in kWh
        winterModeActive:
          type: boolean
          description: Whether winter mode threshold is met

    SetModeRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/ControllerMode'

    SetSetpointRequest:
      type: object
      required: [setpointW]
      properties:
        setpointW:
          type: number

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    VerschattungStateResponse:
      type: object
      additionalProperties: false
      required: [covers, inputs]
      properties:
        covers:
          type: array
          items:
            $ref: '#/components/schemas/VerschattungCoverState'
        inputs:
          $ref: '#/components/schemas/VerschattungInputs'

    VerschattungCoverState:
      type: object
      additionalProperties: false
      required: [id, zone, floor, label, currentPosition, state, expectedPosition]
      properties:
        id: { type: string }
        zone: { type: string, enum: [ost, sued, west] }
        floor: { type: string, enum: [EG, OG] }
        label: { type: string }
        currentPosition: { type: number, nullable: true }
        state: { type: string, enum: [IDLE, CLOSED_BY_AUTO, OVERRIDE] }
        expectedPosition: { type: number, nullable: true }
        lastEvent:
          type: object
          nullable: true
          properties:
            ts: { type: string }
            source: { type: string, enum: [auto, user, reset] }
            fromPosition: { type: number, nullable: true }
            toPosition: { type: number, nullable: true }
            reason: { type: string, nullable: true }

    VerschattungInputs:
      type: object
      additionalProperties: false
      required: [sun, pvPowerW, pvThresholdW, indoorTempC, isSummerMode]
      properties:
        sun:
          type: object
          required: [azimuthDeg, elevationDeg]
          properties:
            azimuthDeg: { type: number }
            elevationDeg: { type: number }
        pvPowerW: { type: number, nullable: true }
        pvThresholdW: { type: number }
        indoorTempC: { type: number, nullable: true }
        isSummerMode: { type: boolean }

    VerschattungDecision:
      type: object
      additionalProperties: false
      required: [coverId, zone, action, reason, evaluatedConditions, appliedAt, resultingState]
      properties:
        coverId: { type: string }
        zone: { type: string, enum: [ost, sued, west] }
        action: { type: string, enum: [close, open, skip] }
        reason: { type: string }
        evaluatedConditions:
          type: array
          items:
            type: object
            required: [name, ok, detail]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: string }
        appliedAt: { type: string }
        resultingState: { type: string, enum: [IDLE, CLOSED_BY_AUTO, OVERRIDE] }
        expectedPosition: { type: number, nullable: true }

    VerschattungConfig:
      type: object
      additionalProperties: false
      required: [zones, pvThreshold, indoorTempThresholdC, hysteresisIndoorTempC, hysteresisPvFactor, hysteresisPvDurationMinutes, summerModeMonths]
      properties:
        zones:
          type: object
          required: [ost, sued, west]
          properties:
            ost:  { $ref: '#/components/schemas/VerschattungZoneTunables' }
            sued: { $ref: '#/components/schemas/VerschattungZoneTunables' }
            west: { $ref: '#/components/schemas/VerschattungZoneTunables' }
        pvThreshold:
          type: object
          required: [peakWp, factor, floorW]
          properties:
            peakWp: { type: number }
            factor: { type: number }
            floorW: { type: number }
        indoorTempThresholdC: { type: number }
        hysteresisIndoorTempC: { type: number }
        hysteresisPvFactor: { type: number }
        hysteresisPvDurationMinutes: { type: number }
        summerModeMonths:
          type: array
          items: { type: integer, minimum: 1, maximum: 12 }

    VerschattungZoneTunables:
      type: object
      required: [closePosition]
      properties:
        closePosition: { type: number, minimum: 0, maximum: 100 }
